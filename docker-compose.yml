services:
  db-despachos:
    image: mysql:8.0
    container_name: db-despachos-standalone
    restart: always
    environment:
      MYSQL_DATABASE: despachos_db
      MYSQL_USER: despachos_user
      MYSQL_PASSWORD: despachos_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - despachos-data:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-despachos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-despachos-standalone
    restart: always
    ports:
      - "8081:8081"
    environment:
      DB_ENDPOINT: db-despachos
      DB_PORT: 3306
      DB_NAME: despachos_db
      DB_USERNAME: despachos_user
      DB_PASSWORD: despachos_pass
      SPRING_DATASOURCE_URL: jdbc:mysql://db-despachos:3306/despachos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
    depends_on:
      db-despachos:
        condition: service_healthy

volumes:
  # Named volume: Docker manages MySQL files and preserves dispatch data across container restarts.
  despachos-data:
